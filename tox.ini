[tox]
requires = tox-uv>=1
envlist = py{312}-django{42,52}, coverage, pylint

[testenv]
runner = uv-venv-lock-runner
dependency_groups =
    django42: django42
    django52: test
commands =
    coverage run -p -m pytest {posargs:}

[testenv:coverage]
runner = uv-venv-lock-runner
dependency_groups = test
commands =
    coverage combine
    coverage report -m
    coverage html

[testenv:pylint]
runner = uv-venv-lock-runner
dependency_groups = quality
commands =
    pylint edx_lint test

[pytest]
addopts = -rfe

; Warnings that we don't want to see.
; Why we use filterwarnings instead of PYTHONWARNINGS:
;   https://nedbatchelder.com/blog/201810/why_warnings_is_mysterious.html
filterwarnings =
    ignore::pytest.PytestDeprecationWarning
    ignore::PendingDeprecationWarning:astroid
    ignore::DeprecationWarning:astroid
    ignore::DeprecationWarning:pylint
