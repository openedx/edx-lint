name: Python CI

on:
  push:
    branches: [master]
  pull_request:
    branches:
    - '**'
  workflow_call:

jobs:
  run_tests:
    name: ${{ matrix.toxenv }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.12']
        toxenv: [pylint, django42, django52]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Setup uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        enable-cache: true
        python-version: "${{ matrix.python-version }}"

    - name: Install CI dependencies
      run: uv sync --group ci --locked

    - name: Run Tests
      run: uv run --locked tox -e ${{ matrix.toxenv }}
